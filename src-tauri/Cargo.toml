[package]
name = "youcam"
version = "2.0.0"
description = "A webcam app for YouTube users"
authors = ["codesignist"]
license = "ISC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the tray menu; image-png: the tray icon is handed over as PNG
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# The hide/show shortcut that works while another app (e.g. a game) has focus
tauri-plugin-global-shortcut = "2"

[profile.release]
# A smaller executable; this app does little work on the Rust side
codegen-units = 1
lto = true
opt-level = "s"
strip = true
