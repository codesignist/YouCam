<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouCam Light</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      body.idle {
        cursor: none;
      }

      /* Only there to open the colour picker for "Custom..."; it is moved to
         where the menu was opened so the picker appears next to it */
      #custom-color {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <input type="color" id="custom-color" tabindex="-1" />
    <script type="module" src="/src/light.ts"></script>
  </body>
</html>
